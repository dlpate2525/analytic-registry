name: Validate artifacts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: analytic-registry/package-lock.json
      - name: Install prototype dependencies
        run: npm ci
        working-directory: analytic-registry
      - name: Check prototype
        run: npm run check
        working-directory: analytic-registry
      - name: Check documentation and preparation
        run: |
          npm run check:docs
          npm run check:preparation
          npm run prepare:release -- --check
        working-directory: analytic-registry
      - name: Build prototype
        run: npm run build
        working-directory: analytic-registry
      - name: Check platform collection adapter
        run: node --test platform-data-collection/tests/normalize.test.mjs platform-data-collection/v1-extract/tests/alteryx-backend.test.mjs
      - name: Check release resources
        run: npm run check:release
        working-directory: analytic-registry
      - name: Verify historical V1 workbook
        run: python3 platform-data-collection/verify-delivery.py --workbook-only
      - name: Check V1.1 query contracts
        run: node platform-data-collection/v1.1-extract/queries/verify-queries.mjs
      - name: Verify V1.1 workbook
        run: python3 platform-data-collection/v1.1-extract/scripts/verify-workbook.py
      - name: Check current SQL profiles
        run: |
          node platform-data-collection/v1.1-extract/scripts/verify-tableau-selects.mjs
          node platform-data-collection/v1.1-extract/scripts/verify-alteryx-sqlserver.mjs
          node platform-data-collection/v1.1-extract/queries/verify-fabric.mjs
      - name: Check V1.2 workbook and delivery behavior
        run: |
          python3 platform-data-collection/v1.2-workbook/verify-workbook.py
          python3 platform-data-collection/v1.1-extract/scripts/verify-producer-fixtures.py
          python3 platform-data-collection/v1.1-extract/scripts/verify-delivery-validation.py
      - name: Verify publication artifacts
        run: |
          python3 scripts/package-publication.check.py
          python3 scripts/package-publication.py --check
